<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danmu Fire</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        font-src 'self';
        img-src 'self' data: https:;
        connect-src 'self';
      "
    />

    <!-- 2026-08-19 設計稿 12「字體規範」：介面一律系統字體。
         這裡原本連 fonts.googleapis.com 抓 5 個字族——桌面應用離線時會直接
         掉字，而系統字體本來就在本機。CSP 的 style-src / font-src 也隨之
         收回 'self'，不再開放外部來源。
         顯示層動畫用的 Bebas / Orbitron 由 child.css 以 woff2 自帶。 -->
    <link rel="stylesheet" href="tailwind.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="hud.css" />
  </head>
  <!-- ══════════════════════════════════════════════════════════════════
       設計稿 04「桌面端示範」：三分區側欄 800×900 → **單頁 560×440**。
       主持人在這個視窗只做兩件事：開／關顯示層，還有決定顯示在哪個螢幕。
       連線與關於收進右上 ⚙；狀態從三處（標題列／側欄／卡片）收成卡片一處。
       ══════════════════════════════════════════════════════════════════ -->
  <body class="client-body">
    <a href="#main-content" class="skip-link" data-i18n="skipToMainContent">Skip to main content</a>

    <!-- 標題列。macOS 用 hiddenInset，系統交通燈畫在左側留白上；
         Windows/Linux 走系統框，這條只留應用名與 ⚙。 -->
    <header class="client-titlebar" role="banner">
      <span class="client-titlebar-label">Danmu Fire</span>
      <button
        type="button"
        id="client-settings-btn"
        class="client-titlebar-gear"
        aria-label="設定"
        aria-haspopup="dialog"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <!-- 有更新時亮小紅點（設計稿 04 · S6），不阻斷操作 -->
        <span class="client-titlebar-gear-dot" id="titlebar-update-badge" hidden aria-label="有更新"></span>
      </button>
      <!-- 舊的標題列狀態；設計稿 04 把狀態收進卡片，這裡只留給
           connection-status.js 寫入，不佔版位。 -->
      <span class="client-titlebar-status" hidden>
        <span class="client-titlebar-status-dot" data-client-status="disconnected"></span>
        <span class="client-titlebar-status-text" data-i18n="disconnected">未連線</span>
      </span>
    </header>

    <div id="toast-container" role="region" aria-live="polite"></div>

    <div class="client-shell" data-client-shell>
      <main id="main-content" tabindex="-1" class="client-main">

        <!-- S4 · 連線失敗橫幅：原因、已重試次數、兩個動作（設計稿 04）。 -->
        <div class="client-banner is-error" id="client-conn-banner" hidden role="alert">
          <div class="client-banner-body">
            <div class="client-banner-title" data-i18n="clientConnFailTitle">無法連線到伺服器</div>
            <div class="client-banner-text" data-conn-banner-text></div>
          </div>
          <div class="client-banner-actions">
            <button type="button" class="client-action-btn" data-conn-banner-retry data-i18n="clientRetry">重試</button>
            <!-- 用自己的 attribute，不跟設定群組裡的伺服器列共用同一個
                 名字：兩個元素同名會讓選擇器變成「命中兩個，取第一個」，
                 而第一個（這顆）平常是隱藏的——e2e 就這樣逾時了。 -->
            <button type="button" class="client-action-btn" data-conn-banner-edit data-i18n="clientChangeAddress">變更位址</button>
          </div>
        </div>

        <!-- S6 · 有更新橫幅：可關閉、不阻斷（設計稿 04）。 -->
        <div class="client-banner is-info" id="client-update-banner" hidden>
          <div class="client-banner-body">
            <div class="client-banner-title" id="update-card-title" data-i18n="updateUpToDate">已是最新版本</div>
            <div class="client-banner-text"><span id="update-card-version"></span></div>
          </div>
          <div class="client-banner-actions">
            <button type="button" class="client-action-btn is-primary" id="update-card-install" hidden data-i18n="updateInstallNow">重新啟動並更新</button>
            <button type="button" class="client-action-btn" id="update-card-later" hidden data-i18n="updateRemindLater">下次關閉時再更新</button>
            <button type="button" class="client-banner-close" id="update-card-skip" hidden aria-label="關閉">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                   stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
        </div>

        <!-- ── S2/S3 · 主卡：顯示層開關 ──────────────────────────
             狀態只在這裡出現一次：色點 ＋ 一行文字。 -->
        <section class="client-main-card" data-client-main-card>
          <span class="client-main-card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>
            </svg>
          </span>
          <div class="client-main-card-body">
            <div class="client-main-card-title" data-i18n="clientOverlayTitle">顯示層</div>
            <div class="client-main-card-status" role="status" aria-live="polite">
              <span class="client-main-card-dot" data-client-overlay-dot></span>
              <span data-client-overlay-status data-i18n="clientOverlayOff">未開啟</span>
            </div>
          </div>
          <button
            type="button"
            class="client-overlay-button"
            data-client-overlay-button
            aria-pressed="false"
          >
            <span data-client-overlay-state data-i18n="overlayButtonStart">開啟</span>
          </button>
        </section>

        <!-- ── 設定群組：顯示在 / 伺服器（設計稿 04 · S2）────────── -->
        <div class="client-group">
          <!-- S5 · 螢幕選擇 -->
          <div class="client-group-row">
            <span class="client-group-label" data-i18n="overlayDisplayLabel">顯示在</span>
            <span class="client-group-value">
              <span class="client-screen-row" data-client-screens></span>
              <span class="client-group-note" data-client-screen-count></span>
            </span>
          </div>
          <select id="screen-select" hidden aria-hidden="true" tabindex="-1"></select>
          <label class="client-group-row is-checkbox">
            <span class="client-group-label" data-i18n="syncMultiDisplay">所有螢幕同步顯示</span>
            <input type="checkbox" id="sync-multi-display-checkbox" class="client-switch-input" />
            <span class="client-switch" aria-hidden="true"><span class="client-switch-knob"></span></span>
          </label>

          <!-- 伺服器 —— 顯示模式；點整列進編輯（沿用 conn-section-wire 的契約） -->
          <div data-conn-display>
            <div class="client-group-row client-conn-host-row" data-client-action="edit-conn"
                 role="button" tabindex="0" aria-label="變更伺服器位址">
              <span class="client-group-label" data-i18n="clientServerLabel">伺服器</span>
              <span class="client-group-value">
                <span class="client-conn-host" data-client-server-host data-i18n="connHostEmptyHint">未設定</span>
                <span class="client-conn-test-chip" data-conn-test-chip data-state="idle"></span>
                <span class="client-group-caret" aria-hidden="true">›</span>
              </span>
            </div>
            <span class="client-conn-preview" data-conn-canonical-preview hidden></span>
          </div>

          <!-- 伺服器 —— 編輯模式 -->
          <div class="client-conn-edit" data-conn-edit hidden>
            <label class="client-conn-edit-label" for="conn-server-input" data-i18n="clientServerLabel">伺服器</label>
            <div class="client-conn-edit-row">
              <input
                type="text"
                id="conn-server-input"
                data-i18n-placeholder="connServerPlaceholder"
                placeholder="danmu.acme.co 或 192.168.1.50:8443"
                autocomplete="off"
                spellcheck="false"
              />
              <button type="button" class="client-action-btn is-primary" data-conn-edit-save data-i18n="connBtnApply">套用</button>
              <button type="button" class="client-action-btn" data-conn-edit-cancel data-i18n="connBtnCancel">取消</button>
            </div>
            <button type="button" class="client-conn-test-btn" data-conn-test-btn>
              <span data-i18n="connTestBtn">測試連線</span>
            </button>
          </div>
        </div>

        <!-- 次要動作 -->
        <div class="client-overlay-actions">
          <button type="button" class="client-action-btn" data-client-overlay-action="clear" data-i18n="overlayActionClear">清空畫面</button>
          <button type="button" class="client-action-btn" data-client-overlay-action="test-danmu" disabled data-i18n="overlayActionTestDanmu">試放一則</button>
          <button type="button" class="client-action-btn" data-client-overlay-action="idle-qr" aria-pressed="false" disabled data-i18n="overlayActionIdleQr">顯示入場 QR</button>
        </div>

        <!-- 舊的連線指示容器：ws-manager / connection-status 仍會寫，
             但設計稿 04 已把狀態收進主卡，所以不顯示。 -->
        <div id="connection-status" hidden>
          <div id="status-indicator"></div>
          <span id="status-text"></span>
        </div>
        <input type="text" id="host-input" hidden aria-hidden="true" tabindex="-1" />
        <input type="text" id="port-input" hidden aria-hidden="true" tabindex="-1" />
      </main>
    </div>

    <!-- ══════════════════════════════════════════════════════════════
         S1 · 首次啟動精靈（設計稿 04）。只問一個欄位。
         localStorage 沒有 server 位址時由 client-shell.js 顯示。
         ══════════════════════════════════════════════════════════════ -->
    <div class="client-onboarding" id="client-onboarding" hidden role="dialog" aria-modal="true"
         aria-labelledby="client-onboarding-title">
      <div class="client-onboarding-panel">
        <img src="assets/brand/icon-256.png" alt="" class="client-onboarding-icon" width="64" height="64" />
        <h1 class="client-onboarding-title" id="client-onboarding-title" data-i18n="clientOnboardTitle">連接到你的伺服器</h1>
        <p class="client-onboarding-body" data-i18n="clientOnboardBody">輸入主辦方給你的網址。之後可以在設定裡隨時修改。</p>
        <input
          type="text"
          id="client-onboarding-input"
          class="client-onboarding-input"
          data-i18n-placeholder="connServerPlaceholder"
          placeholder="danmu.acme.co 或 192.168.1.50:8443"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="client-onboarding-status" data-onboarding-status hidden></div>
        <div class="client-onboarding-actions">
          <button type="button" class="client-action-btn is-primary" data-onboarding-continue
                  data-i18n="clientOnboardContinue">測試並繼續</button>
          <button type="button" class="client-action-btn is-text" data-onboarding-skip
                  data-i18n="clientOnboardSkip">稍後設定</button>
        </div>
      </div>
    </div>

    <!-- ══════════════════════════════════════════════════════════════
         P1 · 設定面板（設計稿 04）。取代原本的「連線」與「關於」兩分頁。
         ══════════════════════════════════════════════════════════════ -->
    <div class="client-settings" id="client-settings" hidden role="dialog" aria-modal="true"
         aria-labelledby="client-settings-title">
      <div class="client-settings-backdrop" data-settings-close></div>
      <div class="client-settings-panel">
        <div class="client-settings-head">
          <span class="client-settings-title" id="client-settings-title" data-i18n="settings">設定</span>
          <button type="button" class="client-settings-done" data-settings-close data-i18n="clientDone">完成</button>
        </div>

        <div class="client-settings-scroll">
          <!-- 伺服器 -->
          <div class="client-settings-section">
            <div class="client-settings-section-title" data-i18n="clientServerLabel">伺服器</div>
            <div class="client-group">
              <div class="client-group-row">
                <span class="client-group-label" data-i18n="clientAddress">位址</span>
                <span class="client-group-value">
                  <span data-conn-last-addr>—</span>
                  <span class="client-group-note" data-conn-last-when data-i18n="connLastNever">尚未連線</span>
                </span>
              </div>
              <details class="client-group-row is-block" data-conn-auth-panel>
                <summary class="client-group-summary">
                  <span class="client-group-label" data-i18n="clientConnPassword">連線密碼</span>
                  <span class="client-group-value">
                    <span data-conn-auth-status data-i18n="connAuthStatusUnset">未設定</span>
                    <span class="client-group-caret" aria-hidden="true">›</span>
                  </span>
                </summary>
                <input
                  type="password"
                  id="ws-token-input"
                  data-i18n-placeholder="clientConnPasswordPlaceholder"
                  placeholder="伺服器要求時才需要"
                  autocomplete="off"
                />
                <p class="client-group-help" data-i18n="clientConnPasswordHelp">只有在伺服器啟用連線密碼時才需要填。密碼在 Admin 的「安全」頁。</p>
              </details>
            </div>
          </div>

          <!-- 一般 -->
          <div class="client-settings-section">
            <div class="client-settings-section-title" data-i18n="clientGeneral">一般</div>
            <div class="client-group">
              <label class="client-group-row is-checkbox">
                <span class="client-group-label" data-i18n="clientAutoOpen">登入時自動開啟顯示層</span>
                <input type="checkbox" id="client-auto-open" class="client-switch-input" />
                <span class="client-switch" aria-hidden="true"><span class="client-switch-knob"></span></span>
              </label>
              <div class="client-group-row">
                <span class="client-group-label" data-i18n="clientStartupAnim">啟動動畫</span>
                <span class="client-group-value">
                  <select id="client-startup-anim" class="client-select">
                    <option value="linkstart">LINK START</option>
                    <option value="domain">領域展開</option>
                    <option value="custom" data-i18n="clientStartupCustom">自訂文字</option>
                    <option value="off" data-i18n="clientStartupOff">關閉</option>
                  </select>
                </span>
              </div>
              <div class="client-group-row">
                <span class="client-group-label" data-i18n="clientShortcut">快速鍵</span>
                <span class="client-group-value"><kbd class="client-kbd" data-client-shortcut>⌘⇧D</kbd></span>
              </div>
            </div>
          </div>

          <!-- 關於 -->
          <div class="client-settings-section">
            <div class="client-settings-section-title" data-i18n="sectionAboutTitle">關於</div>
            <div class="client-group">
              <div class="client-group-row">
                <span class="client-group-label">Danmu Fire</span>
                <span class="client-group-value">
                  <span data-client-version>v—</span>
                  <span class="client-group-note">
                    <span data-client-about-electron-version>Electron —</span> ·
                    <span data-client-about-platform>Desktop</span>
                  </span>
                  <!-- app-shell-meta.js 會一併寫這兩個；設計稿 04 的單頁只顯示
                       一次版本與平台，所以另一份留在 DOM 但不佔版位。 -->
                  <span data-client-about-version hidden>v—</span>
                  <span data-client-platform hidden>Desktop</span>
                </span>
              </div>
              <button type="button" class="client-group-row is-button" id="update-card-check">
                <span class="client-group-label" data-i18n="checkForUpdates">檢查更新</span>
                <span class="client-group-value">
                  <span class="client-group-note" id="update-card-notes"></span>
                  <span class="client-group-caret" aria-hidden="true">›</span>
                </span>
              </button>
              <div class="client-group-row" id="update-card-progress" hidden>
                <span class="client-group-label" id="update-card-progress-label">0%</span>
                <span class="client-group-value client-progress">
                  <span class="client-progress-fill" id="update-card-progress-bar" style="width: 0%"></span>
                </span>
              </div>
              <p class="client-group-help" id="update-card-error" hidden></p>
              <button type="button" class="client-group-row is-button" id="about-github-link">
                <span class="client-group-label">GitHub</span>
                <span class="client-group-value"><span class="client-group-caret" aria-hidden="true">↗</span></span>
              </button>
            </div>
          </div>

          <!-- 設定備份 -->
          <div class="client-settings-section">
            <div class="client-settings-section-title" data-i18n="clientBackup">設定備份</div>
            <div class="client-overlay-actions">
              <button type="button" class="client-action-btn" id="export-settings-btn" data-i18n="exportSettings">匯出設定</button>
              <button type="button" class="client-action-btn" id="import-settings-btn" data-i18n="importSettings">匯入設定</button>
            </div>
          </div>
        </div>
      </div>
      <!-- 舊 update-card 容器：update-status.js 會 toggle 它的 hidden。
           橫幅與設定頁各自取用其中的子元素，這層只作為它的掛載點。 -->
      <div id="update-card" hidden aria-live="polite"></div>
    </div>

    <!-- Window Picker modal (#117) -->
    <div class="wp-backdrop" id="wpBackdrop" hidden>
      <div class="wp-modal">
        <div class="wp-header">
          <h2 class="wp-title" data-i18n="windowPickerTitle">視窗選擇器</h2>
          <button type="button" class="wp-close" id="wpClose" aria-label="Close">&times;</button>
        </div>
        <div class="wp-tabs">
          <button type="button" class="wp-tab active" data-wp-tab="screen" data-i18n="windowPickerScreens">螢幕</button>
          <button type="button" class="wp-tab" data-wp-tab="window" data-i18n="windowPickerWindows">視窗</button>
        </div>
        <div class="wp-grid" id="wpGrid">
          <div class="wp-loading" data-i18n="windowPickerLoading">載入中…</div>
        </div>
        <div class="wp-footer">
          <span class="wp-hint" id="wpHint" data-i18n="windowPickerHint">選擇螢幕或視窗以定位顯示層</span>
        </div>
      </div>
    </div>

    <!-- Renderer Logic (bundled locally for instant load) -->
    <script src="i18n.js"></script>
    <script src="./dist/renderer.bundle.js"></script>
    <script src="./client-nav.js"></script>
    <script src="./client-shell.js"></script>
  </body>
</html>
