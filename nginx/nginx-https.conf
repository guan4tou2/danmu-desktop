events {}

http {
  server_tokens off;

  # ── 壓縮（2026-09-08）───────────────────────────────────────────────────
  # 在這之前完全沒開：admin 冷載實測 2483 KB / 69 個檔全部未壓縮
  # （i18n.js 670 KB、style.css 482 KB 是大宗）。開啟後實測 678 KB，3.7x。
  #
  # `gzip_proxied any`：這裡所有回應都來自 upstream，沒有這行不會壓。
  #
  # **關於 BREACH**：nginx 的 `text/html` 是隱含永遠壓縮的，`gzip_types` 拿不掉，
  # 而 admin.html 裡確實有一個穩定的祕密（`<meta name="csrf-token">`）。
  # 評估後仍然開著，理由有兩個各自獨立成立：
  #   1. **模板不反射任何請求輸入**（沒有 request.args / request.path / header
  #      進到 admin.html）。BREACH 要靠「把猜測字元塞進同一份回應」來量長度差，
  #      沒有反射點就沒有這個管道。這條由
  #      `test_admin_template_reflects_no_request_input` 釘住。
  #   2. session cookie 是 `SameSite=Strict`，跨站請求根本不帶 cookie，
  #      攻擊者拿到的是登入頁，裡面的 csrf-token 是空的。
  # **要是哪天有人把請求輸入 templating 進 admin.html，這個判斷就失效**——
  # 上面那支測試會先失敗，屆時再決定是不是要對該 location 關掉 gzip。
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;          # 5 之後對這類文字檔邊際效益很低，CPU 卻明顯上升
  gzip_min_length 1024;       # 小檔壓了反而更大
  gzip_types
    application/javascript
    text/javascript
    text/css
    application/json
    image/svg+xml
    text/plain;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Slowloris 防護
  client_header_timeout 10s;
  client_body_timeout   10s;
  keepalive_timeout     65s;
  send_timeout          10s;

  # 上傳大小上限（對齊 Flask MAX_CONTENT_LENGTH = 15MB）
  client_max_body_size  15m;

  # 每個 IP 最多 20 個同時連線
  limit_conn_zone $binary_remote_addr zone=danmu_conn:10m;

  # 每個 IP 每秒最多 10 個 HTTP 請求（burst=30 允許短暫暴增，超過回 429）
  limit_req_zone $binary_remote_addr zone=danmu_req:10m rate=10r/s;
  limit_req_status 429;

  # Docker 內建 DNS resolver，延遲解析 upstream 避免啟動時 host not found
  resolver 127.0.0.11 valid=30s ipv6=off;

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;
    limit_conn danmu_conn 20;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # v5.3.0+: WS merged onto Flask's private app port at /ws. The `location /`
    # block below already forwards Upgrade headers, so wss:// upgrades at
    # /ws reach Flask's flask-sock handler without a dedicated block.

    # Admin routes — 已登入後台,不套 public 反刷屏 limit_req。
    # admin.js boot 會同時觸發 ~25 個 /admin/* GET (themes / effects /
    # sounds / emojis / stickers / scheduler / webhooks / filters /
    # plugins / widgets / fingerprints / fonts / history / blacklist /
    # metrics / ws-auth 等),此模式屬正常,交由 Flask 內部 rate_limit
    # 裝飾器依 ADMIN_RATE_LIMIT 控管。
    location /admin/ {
      set $danmu_admin "server";
      proxy_pass http://$danmu_admin:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 600s;
    }

    # Static assets are bursty on first paint (admin loads many JS chunks).
    # Keep these outside public / location rate limiting to avoid 429 cascades.
    location /static/ {
      set $danmu_static "server";
      proxy_pass http://$danmu_static:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 600s;
    }

    # Admin bootstrap currently reads /get_settings from root path.
    # Exempt this read-only endpoint from public limit_req.
    location = /get_settings {
      set $danmu_settings "server";
      proxy_pass http://$danmu_settings:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 600s;
    }

    # v5.0.0+ viewer-side polling endpoints (Phase 2 WS removal).
    # Each viewer polls these every 2s — under public `limit_req` (10r/s)
    # a small NAT'd audience can exhaust the bucket and 429 real /fire
    # sends. These are read-only, idempotent, and cheap, so route them
    # outside the public limit like /get_settings does.
    location = /poll/public-status {
      set $danmu_poll_pub "server";
      proxy_pass http://$danmu_poll_pub:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 600s;
    }
    location = /session/public-state {
      set $danmu_sess_pub "server";
      proxy_pass http://$danmu_sess_pub:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 600s;
    }

    # HTTP — 套用限流(public)
    location / {
      limit_req zone=danmu_req burst=30 nodelay;
      set $danmu_http "server";
      proxy_pass http://$danmu_http:8080;
      proxy_http_version 1.1;
      # `$http_host` preserves the non-default port that the
      # client connected to. Using bare `$host` strips the port, so
      # Flask's url_for()-based redirects (e.g. GET /admin → /admin/)
      # generate `Location: https://<ip>/admin/` (port 443) and land on
      # whatever else occupies 443 on the box (netbird-caddy, etc.).
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 600s;
    }
  }

}
