events {}

http {
  server_tokens off;

  # ── 壓縮（2026-09-08）───────────────────────────────────────────────────
  # 在這之前完全沒開：admin 冷載實測 2483 KB / 69 個檔全部未壓縮
  # （i18n.js 670 KB、style.css 482 KB 是大宗）。開啟後實測 678 KB，3.7x。
  #
  # `gzip_proxied any`：這裡所有回應都來自 upstream，沒有這行不會壓。
  #
  # **關於 BREACH**：nginx 的 `text/html` 是隱含永遠壓縮的，`gzip_types` 拿不掉，
  # 而 admin.html 裡確實有一個穩定的祕密（`<meta name="csrf-token">`）。
  # 評估後仍然開著，理由有兩個各自獨立成立：
  #   1. **模板不反射任何請求輸入**（沒有 request.args / request.path / header
  #      進到 admin.html）。BREACH 要靠「把猜測字元塞進同一份回應」來量長度差，
  #      沒有反射點就沒有這個管道。這條由
  #      `test_admin_template_reflects_no_request_input` 釘住。
  #   2. session cookie 是 `SameSite=Strict`，跨站請求根本不帶 cookie，
  #      攻擊者拿到的是登入頁，裡面的 csrf-token 是空的。
  # **要是哪天有人把請求輸入 templating 進 admin.html，這個判斷就失效**——
  # 上面那支測試會先失敗，屆時再決定是不是要對該 location 關掉 gzip。
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;          # 5 之後對這類文字檔邊際效益很低，CPU 卻明顯上升
  gzip_min_length 1024;       # 小檔壓了反而更大
  gzip_types
    application/javascript
    text/javascript
    text/css
    application/json
    image/svg+xml
    text/plain;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Slowloris 防護
  client_header_timeout 10s;
  client_body_timeout   10s;
  keepalive_timeout     65s;
  send_timeout          10s;

  # 上傳大小上限（對齊 Flask MAX_CONTENT_LENGTH = 15MB）
  client_max_body_size  15m;

  # 每個 IP 最多 20 個同時連線
  limit_conn_zone $binary_remote_addr zone=danmu_conn:10m;

  # 每個 IP 每秒最多 10 個 HTTP 請求（burst=30 允許短暫暴增，超過回 429）
  limit_req_zone $binary_remote_addr zone=danmu_req:10m rate=10r/s;
  limit_req_status 429;

  resolver 127.0.0.11 valid=30s ipv6=off;

  server {
    listen 80;
    server_name _;
    limit_conn danmu_conn 20;

    # Static assets are bursty on first paint (admin loads many JS chunks).
    # Do not rate-limit these files at nginx; backend auth/csrf still applies
    # to mutable endpoints.
    location /static/ {
      set $http_host_var "server";
      proxy_pass http://$http_host_var:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 600s;
    }

    # Admin bootstrap currently fetches /get_settings from root path.
    # Exempt this read-only endpoint from public limit_req to avoid 429
    # cascades during initial admin load.
    location = /get_settings {
      set $http_host_var "server";
      proxy_pass http://$http_host_var:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 600s;
    }

    # v5.0.0+ viewer-side polling endpoints (Phase 2 WS removal). Each
    # viewer polls these every 2s; under public `limit_req` a NAT'd
    # audience can exhaust the bucket and 429 real /fire sends. Same
    # rationale as /get_settings above.
    location = /poll/public-status {
      set $http_host_var "server";
      proxy_pass http://$http_host_var:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 600s;
    }
    location = /session/public-state {
      set $http_host_var "server";
      proxy_pass http://$http_host_var:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 600s;
    }

    location / {
      limit_req  zone=danmu_req burst=30 nodelay;
      set $http_host_var "server";
      proxy_pass http://$http_host_var:8080;
      proxy_http_version 1.1;
      # Use `$http_host` (not `$host`) to preserve the port the client
      # actually connected to. Required for correct Flask redirects on
      # non-standard dev ports and for
      # Trusted-Hosts validation when TRUSTED_HOSTS includes `:port`.
      # See nginx-https.conf for the longer version of this explanation.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 600s;
    }
  }

}
