<!DOCTYPE html>
<!-- lang 由 ServerI18n.init() 依介面語言改寫（設計稿 17）。這裡的值是
     JS 跑起來之前的預設，不是最終值。 -->
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="csrf-token"
      content="{{ session.get('csrf_token', '') }}"
    />
    <title>Danmu Fire — Admin</title>
    <meta name="description" content="Danmu Fire administration panel — manage settings, blacklist, effects, and history." />
    <meta name="theme-color" content="#000000" />
    <!-- 設計稿 11：Web favicon 用符號 SVG（= assets/brand/app-icon-small.svg）。
         .ico 留著當不支援 SVG favicon 的瀏覽器的 fallback。 -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tailwind.css') }}"
    />
    <!-- 2026-08-19 設計稿 12「字體規範」：介面一律系統字體。
         先前這裡下載 9 個字族（Bebas / JetBrains Mono / Klee One /
         Noto Sans ×4 / Noto Serif TC / Orbitron）共 20+ 個字重，
         全部只為了排介面——系統字體本來就排得更好，中英混排也更穩。
         顯示層啟動動畫用的 Bebas / Orbitron 由 Electron 端 child.css
         以 woff2 自帶，不走網路。 -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body class="admin-body min-h-screen overflow-x-hidden">
    <a href="#app-container" class="skip-link">Skip to main content</a>

    <div
      id="app-container"
      class="admin-app-shell animate-fade-in-scale-up"
      tabindex="-1"
    >
      <!-- 骨架載入態：admin.js 用真正的控制台取代 innerHTML 之前的佔位。
           2026-09-07 拿掉 HUD 角標與「DANMU · ADMIN · BOOT」那行——設計稿 14
           的文案規則明訂「不用全大寫」，`.hud-corners`／`.hud-dot`／`.hud-label`
           也在 §3 刪除清單裡。載入態不需要品牌字，骨架本身就是訊息。 -->
      <div class="glass-effect rounded-3xl shadow-2xl p-6 md:p-8 space-y-6 max-w-md mx-auto">
        <div class="skeleton skeleton-title mx-auto"></div>
        <div class="space-y-4">
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-input"></div>
          <div class="skeleton skeleton-btn"></div>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div
      id="toast-container"
      class="fixed top-5 right-5 flex flex-col gap-2"
      style="z-index:9400"
      aria-live="polite"
      role="status"
    ></div>

    <!-- Scripts -->

    <!-- Inject Configuration -->
    <script nonce="{{ csp_nonce }}">
      window.DANMU_CONFIG = {
        session: { logged_in: {{ session.get('logged_in') | tojson }} },
        settingRanges: {{ ranges | tojson }},
        appVersion: {{ app_version | tojson }},
        // WebSocket is served by Flask on the same web origin at /ws.
        // Admin itself still polls /admin/live-feed/recent.
        wsPath: "/ws",
      };
    </script>

    <script src="{{ url_for('static', filename='vendor/i18next.min.js') }}"></script>
    <!-- 翻譯依語言分檔（2026-09-08）：伺服器用 cookie / Accept-Language 挑一支，
         前端要別的語言時由 i18n.js 自己補載。原本四語全載是 670 KB。 -->
    <script src="{{ url_for('static', filename='js/i18n.' ~ i18n_lang ~ '.js') }}"></script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script nonce="{{ csp_nonce }}">ServerI18n.init();</script>
    <!-- 2026-09-08：這裡原本是 66 個 <script defer>。合成一支 bundle 之後
         gzip 前 1319 → 784 KB、gzip 後 337 → 191 KB，請求數 66 → 1。

         **這不是模組化改寫**：那 66 支仍是全域 IIFE、靠 41 個 window.*
         溝通、相依於載入順序。bundle 只是照原順序串接後 minify，語意不變。

         檔案清單在 static/js/admin-bundle.manifest.json（不在這裡 —— 從模板
         讀清單會變成循環相依）。加新模組：manifest 加一行，再跑
         `npm run build:admin-js`；CI 會檢查 bundle 是不是最新的。 -->
    <script defer src="{{ url_for('static', filename='js/admin.bundle.js') }}"></script>
  </body>
</html>
